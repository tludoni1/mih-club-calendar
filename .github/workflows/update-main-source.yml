name: Update Main Source XML

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  update-main-source:
    name: Update main-source.xml
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Export main source XML
        run: npm run export:xml

      - name: Commit updated XML if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update main source XML"
          file_pattern: "data/main-source.xml"
